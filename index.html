<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- <script src="./scripts/script.min.js" defer></script> -->
    <script src="./scripts/script.js" defer></script>

    <title>Task Management Application </title>
</head>

<body>

    <!--grid grid-rows-2-->
    <!-- <div class=""> -->

    <header class="w-full mx-auto max-w-9xl mt-0 mb-5 justify-center text-center bg-[#f4f2f0]">
        <h1 class=" text-[#917f6b] font-bold text-3xl"> Task Management App </h1>
        <h2 class="ml-5 text-[#917f6b] font-semibold text-lg mt-2 mb-3"> Organize By Colors </h2>
    </header>

    <main class=" flex flex-col w-full md:inline-block justify-center md:justify-start p-5">

        <section
            class="flex flex-col md:inline-block mb-10 md:mb-15 border-2 border-[#d3cbc3] rounded-lg shadow-xl p-6 md:ml-[30%]">
            <!--input Area-->
            <input type=" text" id="taskName" placeholder="Enter task" class="border-3 border-[#917f6b]" />
            <input type="text" id="categoryName" list="categories" placeholder="{Work, School, Personal, Errands}"
                class="border-3 border-[#917f6b]" />
            <datalist id="categories">
                <option value="Work"></option>
                <option value="School"></option>
                <option value="Personal"></option>
                <option value="Errands"></option>
            </datalist>

            <input type="date" id="taskDueDate" value="2026-09-30" min="2026-09-18" max="2027-12-31"
                class="border-3 border-[#917f6b]" />

            <fieldset class="border-3 border-[#917f6b] flex flex-col w-[80%] md:w-[50%] items-center">
                <legend> Task Status :</legend>
                <select name="currentStatus" id="statusDropDown" class="flex flex-col md:flex-row">
                    <option value="none"> Please Choose your initial status </option>
                    <option value="upcoming"> Upcoming </option>
                    <option value="in progress"> In Progress </option>
                    <option value="overdue"> Overdue </option>
                    <option value="completed"> Completed </option>
                </select>
            </fieldset>
            <div class="flex flex-col md:flex-row gap-5 mt-5 mb-5">
                <input class="border-1 border-grey-200 p-1 bg-[#d3cbc3]" type="button" value="Add Task" id="addTask" />
                <!-- <input class="border-1 border-grey-200 p-1" type="button" value="Check If Overdue" id="checkOverdue" /> -->
            </div>
            <div section="flex flex-col md:flex-row gap-5 mt-5"> <!-- filterSection -->

                <input type="text" id="searchField" placeholder="Search Category or Status"
                    class="border-3 border-[#917f6b]" />
                <input class="border-1 border-grey-200 p-1 bg-[#d3cbc3]" type="button" value="Filter Task"
                    id="filterTask" />
            </div>
        </section>

        <div class="dividerSection">

            <h3 class="mb-2 text-[#917f6b] font-bold text-xl"> Task Board </h3>
            <hr class="border-2 border-green-300 mb-15" />
            <div class="resultsSection">

            </div>
        </div>

        <section class="flex flex-col md:flex-row gap-15 justify-center" id="taskList"> <!--displayTaskBoard-->

            <div class="md:inline-block border-1 border-black-100 h-auto w-full md:w-[20%]">
                <div class="text-center">
                    <h3 class="text-blue-600 text-md font-bold mb-4"> Upcoming </h3>

                    <ul id="upcomingList"
                        class="block w-full min-h-[70px] text-black text-left p-2 border-3 border-dashed border-blue-600">
                    </ul>
                </div>
            </div>

            <div class="md:inline-block border-1 border-black-100 h-auto w-full md:w-[20%]">
                <div class="text-center">
                    <h3 class="text-orange-600 text-md font-bold mb-4"> In Progress </h3>
                    <ul id="inprogressList"
                        class="block w-full min-h-[70px] text-black text-left p-2 border-3 border-dashed border-orange-300">

                    </ul>
                </div>
            </div>

            <div class="md:inline-block border-1 border-black-100 h-auto w-full md:w-[20%]">
                <div class="text-center">
                    <h3 class="text-red-600 text-md font-bold mb-4"> Overdue </h3>
                    <ul id="overdueList"
                        class="block w-full min-h-[70px] text-black text-left p-2 border-3 border-dashed border-red-600">

                    </ul>
                </div>
            </div>

            <div class="md:inline-block border-1 border-black-100 h-auto w-full md:w-[20%]">
                <div class="text-center">
                    <h3 class="text-green-600 text-md font-bold mb-4"> Completed </h3>
                    <ul id="completedList" class="block w-full min-h-[70px] text-black text-left p-2 border-3 border-dashed
                        border-green-600">

                    </ul>

                </div>
            </div>
            </div>

        </section>

        <dialog id="updateDialog" class="bg-[#C0C0C0] p-10 rounded-lg shadow-xl m-auto fixed inset-0">
            <form method="dialog">
                <p class="mb-5">
                    <label class="font-semibold text-center">
                        <select id="newStatus">
                            <option value="default"> Choose new status: </option>
                            <option class="text-blue-600" value="upcoming">Upcoming</option>
                            <option class="text-orange-300" value="in progress">In Progress</option>
                            <option class="text-red-600" value="overdue">Overdue</option>
                            <option class="text-green-400" value="completed"> Completed </option>
                        </select>
                    </label>
                </p>
                <div>
                    <button id="confirmBtn" value="default">Confirm</button>
                </div>
            </form>
        </dialog>
    </main>
    <!-- </div> -->
</body>

</html>
